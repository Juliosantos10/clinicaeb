<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento - EB Saúde e Estética</title>
    <link rel="stylesheet" href="../css/style_procedimento.css">
</head>
<body>

<section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
        <h1>Agendamento</h1>
        <p>EB Saúde e Estética</p>
    </div>
</section>

<section id="conteudoProcedimento" style="margin-top:40px;">
    <div style="max-width:500px; margin:20px auto; padding:20px; border:1px solid #ccc; border-radius:10px;">
        <h3 style="text-align:center;">Agende sua sessão</h3>

        <form id="formAgendamento">
            <input type="text" id="nome" placeholder="Nome completo" required style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="email" id="email" placeholder="E-mail" required style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="tel" id="telefone" placeholder="Telefone" required style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="procedimentoSelecionado" readonly style="width:100%; padding:10px; margin-bottom:10px; background:#f5f5f5;">
            <input type="date" id="data" required style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="time" id="hora" required style="width:100%; padding:10px; margin-bottom:10px;">

            <button type="submit" style="width:100%; padding:10px; background:#000; color:#fff; border:none; border-radius:5px;">
                Enviar agendamento
            </button>

            <button type="button" onclick="abrirWhatsApp()" style="width:100%; padding:10px; background:#25D366; color:#fff; border:none; border-radius:5px; margin-top:10px;">
                Agendar pelo WhatsApp
            </button>
        </form>

        <div id="mensagemSucesso" style="display:none; text-align:center; color:green; margin-top:10px;">
            Obrigado! Seu agendamento foi enviado com sucesso.
        </div>
    </div>

    <div style="text-align:center; margin-bottom:40px;">
        <a href="procedimento.html" style="padding:10px 20px; border:1px solid #000; background:#fff; cursor:pointer; text-decoration:none; color:#000;">
            ← Voltar
        </a>
    </div>
</section>

<script src="../js/agendamento.js"></script>

</body>
</html>
