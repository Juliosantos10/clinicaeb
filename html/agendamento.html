<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento - EB Saúde e Estética</title>
    <link rel="stylesheet" href="../css/agendamento.css">
</head>
<body>

<section class="hero">
   <div class="hero-content">
    <img src="../img/logo1.png" alt="EB Saúde e Estética" class="hero-logo">
</div>
</section>

<section id="conteudoProcedimento">

    <div class="form-box">
        <h3>Agende sua sessão</h3>

        <form id="formAgendamento">
            <input type="text" id="nome" placeholder="Nome completo" required>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="tel" id="telefone" placeholder="Telefone" required>

            <input type="text" id="procedimentoSelecionado" readonly>

            <input type="date" id="data" required>

            <select id="hora" required>
                <option value="">Selecione um horário</option>
                <option value="08:00">08:00</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
                <option value="19:00">19:00</option>
                <option value="20:00">20:00</option>
            </select>

            <button type="submit" class="btn-agendar">
                Enviar agendamento
            </button>

            <button type="button" onclick="abrirWhatsApp()" class="btn-whatsapp">
                Agendar pelo WhatsApp
            </button>
        </form>

        <div id="mensagemSucesso">
            Obrigado! Seu agendamento foi enviado com sucesso.
        </div>
    </div>

    <div class="voltar-box">
        <a href="procedimento.html">← Voltar</a>
    </div>

</section>

<script src="../js/agendamento.js"></script>

</body>
</html>
